```yaml
name: Calculator CI

on:
  push:
    branches: [main, feature-test]

  pull_request:
    branches: [main, feature-test]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test_case.py" -v
```